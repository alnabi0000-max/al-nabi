  <text x="95" y="310" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">AI video &amp; image studio</text>
  <rect x="94" y="357" width="212" height="6" rx="3" fill="url(#accent)"/>
